apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-app-stable
  labels:
    app: inventario-app
    version: stable
spec:
  replicas: 4

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: inventario-app
      version: stable

  template:
    metadata:
      labels:
        app: inventario-app
        version: stable

    spec:
      containers:
        - name: inventario-app
          image: ghcr.io/cabreram14/inventario-app:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: APP_VERSION
              value: "v1-stable"

            - name: APP_COLOR
              value: "blue"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"